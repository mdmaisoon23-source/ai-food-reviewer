name: Generate food review video

# Run it from the Actions tab (or the GitHub mobile app): Actions -> "Generate food review video" -> Run workflow.
on:
  workflow_dispatch:
    inputs:
      shop:
        description: "Shop name, 'name, area', or Google Maps link (leave empty to use shops.txt)"
        required: false
        default: ""
      dishes:
        description: "Dishes to feature, comma separated (optional)"
        required: false
        default: ""
      language:
        description: "Script + voice language"
        type: choice
        options: [tamil, english]
        default: tamil
      character:
        description: "AI character"
        type: choice
        options: [arun, meena, karthi]
        default: arun

permissions:
  contents: read

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install FFmpeg and fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg fontconfig fonts-lohit-taml fonts-dejavu-core espeak-ng
          fc-cache -f

      - name: Install Python dependencies
        run: pip install -r backend/requirements.txt

      - name: Render video
        working-directory: backend
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          # inputs go through env vars (never inline in the script) so a crafted shop name cannot inject shell commands
          SHOP: ${{ inputs.shop }}
          DISHES: ${{ inputs.dishes }}
          LANGUAGE: ${{ inputs.language }}
          CHARACTER: ${{ inputs.character }}
          VIDEO_WIDTH: "720"
          VIDEO_HEIGHT: "1280"
          VIDEO_FPS: "24"
        run: |
          if [ -n "$SHOP" ]; then
            python cli.py --shop "$SHOP" --dishes "$DISHES" --language "$LANGUAGE" --character "$CHARACTER" --out ../output
          else
            python cli.py --batch ../shops.txt --language "$LANGUAGE" --character "$CHARACTER" --out ../output
          fi

      - name: Job summary
        if: always()
        run: '[ -f output/summary.md ] && cat output/summary.md >> "$GITHUB_STEP_SUMMARY" || true'

      - name: Upload videos
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: food-review-videos
          path: output/
          retention-days: 30
          if-no-files-found: ignore
